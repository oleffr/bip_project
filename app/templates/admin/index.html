<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/admin.css') }}">
</head>
<body>
    <div class="admin-container">
        <h1>Админ-панель</h1>

        <!-- Кнопка выхода -->
        <div class="logout-section">
            <form action="/api/logout" method="POST" id="logoutForm">
                <button type="submit" class="logout-btn">Выйти</button>
            </form>
        </div>

        <div class="tokens-section">
            <h2>Список токенов пользователей</h2>
            <div id="tokensLoader" class="loader">Загрузка токенов...</div>
            <div id="tokensList" class="tokens-list"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='admin/js/admin.js') }}"></script>
</body>
</html>
