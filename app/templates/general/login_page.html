<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='general/css/login.css') }}">
    <script src="https://yastatic.net/s3/passport-sdk/autofill/v1/sdk-suggest-with-polyfills-latest.js"></script>
</head>

<body>
    <script>


        YaAuthSuggest.init(
            {
                client_id: 'b4716e5dcbd2436a84aac8baa1ef358d',
                response_type: 'token',
                redirect_uri: "https://biplabproject.ru/oauth/oauth_callback"

            },
            "https://biplabproject.ru",
            {
                view: "button",
                parentId: "container",
                buttonSize: 'm',
                buttonView: 'main',
                buttonTheme: 'light',
                buttonBorderRadius: "0",
                buttonIcon: 'ya',
            }
        )
            .then(({ handler }) => handler())
            .then(data => {
                // Формируем тело запроса
                const requestBody = {
                    type: "oauth",
                    data: data
                };

                // Отправляем POST‑запрос
                fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Ошибка сети: ' + response.status);
                        }
                        return response.json();
                    })
                    .then(serverResponse => {
                        console.log('Ответ сервера:', serverResponse);

                        // Логика перенаправления на основе ответа сервера
                        if (serverResponse.redirect_url) {
                            // Перенаправляем на URL, указанный сервером
                            window.location.href = serverResponse.redirect_url;
                        } else if (serverResponse.success) {
                            // Если сервер вернул успех без указания URL — идём на стандартную страницу
                            window.location.href = '/';
                        } else {
                            // В случае, если сервер вернул какой‑то другой статус — идём на страницу ошибки
                            window.location.href = '/auth-error';
                        }
                    })
                    .catch(error => {
                        console.error('Ошибка при выполнении POST‑запроса:', error);
                        window.location.href = '/auth-error';
                    });
            })
            .catch(error => console.log('Обработка ошибки', error))


    </script>
    <div class="login-container">
        <div class="login-form">
            <h1>Вход в систему</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Логин:</label>
                    <input type="text" id="username" name="username" placeholder="Введите логин" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                </div>

                <button type="submit" class="login-btn">Войти</button>

            </form>

            <div id="loginStatus" class="status-message"></div>
            <div id="container"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='general/js/login.js') }}"></script>
</body>

</html>
